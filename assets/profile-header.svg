<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Hesham Elgammal — Senior Frontend &amp; Mobile Engineer</title>
  <desc id="desc">A premium midnight-blue engineering banner with cyan and violet accents, subtle grid, and connected orbital rings.</desc>
  <defs>
